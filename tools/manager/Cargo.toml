[package]
name = "templar-manager"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "tmplrmgr"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Decoding `registry.deploy` init args for display (ENG-544).
base64.workspace = true
borsh.workspace = true
async-trait.workspace = true
clap.workspace = true
dirs.workspace = true
futures.workspace = true
hex.workspace = true
near-account-id.workspace = true
# `keystore` backs `--sign-with keychain`. near-api's `ledger` feature is
# deliberately not enabled: it pulls hidapi, which needs libudev headers, and
# cargo unifies features across a workspace build — every crate here and in CI
# would inherit that system dependency. Nothing needs Ledger signing today.
near-api = { workspace = true, features = ["keystore"] }
near-crypto.workspace = true
near-primitives.workspace = true
near-sandbox.workspace = true
near-token.workspace = true
json-patch.workspace = true
templar-sandbox.workspace = true
# Native binary linking the proxy-oracle contract crates (`Operation`/`Proxy`/
# `Source`): on non-wasm, `near_sdk::env::abort` references the `panic` host
# import, which only near-sdk's `unit-testing` mock defines. `unit-testing` is
# also what the workspace unifies onto near-sdk (via service/gateway et al.), so
# matching it here keeps standalone (`-p templar-manager`) and workspace builds
# collision-free. Mirrors service/gateway, the other native bin over these crates.
near-sdk = { workspace = true, features = ["unit-testing", "non-contract-usage"] }
# Reference-price cross-check (ENG-543): the only outbound HTTP this tool makes.
reqwest = { workspace = true, features = ["json"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# Stable digests: plan/spec hashing must not depend on map iteration order.
sputnikdao2.workspace = true
templar-common.workspace = true
templar-contract-artifacts = { workspace = true, features = ["fetch"] }
templar-patch-state-types.workspace = true
sha2.workspace = true
templar-gateway-client = { workspace = true, features = ["clap"] }
templar-gateway-core.workspace = true
templar-gateway-methods-dispatch.workspace = true
templar-gateway-methods-spec.workspace = true
templar-gateway-oracle-updates-dispatch = { workspace = true, features = ["clap"] }
templar-gateway-oracle-updates-spec.workspace = true
templar-gateway-store.workspace = true
templar-gateway-types = { workspace = true, features = ["clap"] }
templar-tools-common.workspace = true
templar-primitives.workspace = true
templar-proxy-oracle-kernel.workspace = true
templar-proxy-oracle-near-common.workspace = true
templar-proxy-oracle-near-governance-common = { workspace = true, features = ["clap"] }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rstest.workspace = true
templar-gateway-testing.workspace = true

[lints]
workspace = true
