[package]
name = "templar-gateway-core"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core actor, operation, and execution-outcome model for the Templar gateway"

[dependencies]
actix.workspace = true
borsh.workspace = true
base64.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
moka.workspace = true
near-account-id = { workspace = true, features = ["serde", "schemars"] }
near-api.workspace = true
near-contract-standards.workspace = true
near-openapi-client.workspace = true
reqwest.workspace = true
near-sdk = { workspace = true, default-features = false, features = ["non-contract-usage"] }
serde.workspace = true
serde_json_canonicalizer.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
templar-common = { workspace = true, features = ["non-contract-usage"] }
templar-gateway-types.workspace = true
templar-primitives = { workspace = true, features = ["schemars", "serde"] }
templar-proxy-oracle-kernel = { workspace = true, features = ["serde", "schemars"] }
templar-proxy-oracle-near-common.workspace = true
templar-proxy-oracle-near-governance-common.workspace = true
templar-universal-account.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
anyhow.workspace = true
# Path-only, deliberately not `workspace = true`: methods-dispatch depends on
# this crate, so carrying the workspace pin's `version` would keep the
# dev-dependency in the published manifest and leave neither crate publishable
# first. Cargo strips a versionless path dev-dependency on publish.
templar-gateway-methods-dispatch = { path = "../methods-dispatch" }
templar-gateway-methods-spec.workspace = true
near-sandbox.workspace = true
near-token.workspace = true
rstest.workspace = true
templar-gateway-testing.workspace = true
wiremock.workspace = true
tokio.workspace = true
