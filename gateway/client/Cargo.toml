[package]
name = "templar-gateway-client"
version = "0.2.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Direct, in-process gateway client for Rust consumers of Templar Protocol"

[dependencies]
clap = { workspace = true, optional = true }
near-api.workspace = true
url.workspace = true
templar-gateway-core.workspace = true
templar-gateway-methods-dispatch.workspace = true
templar-gateway-store.workspace = true
templar-gateway-types.workspace = true

[features]
# Derive `clap::ValueEnum` on `Network` for CLI consumers.
clap = ["dep:clap"]

[dev-dependencies]
templar-common.workspace = true
templar-contract-artifacts.workspace = true
templar-gateway-artifacts-dispatch.workspace = true
templar-gateway-artifacts-spec.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
