[package]
name = "templar-gateway-types"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared wire, block, and error types for the Templar gateway"

[dependencies]
base64.workspace = true
borsh.workspace = true
clap = { workspace = true, optional = true }
near-api-types = "0.8.5"
near-openapi-types.workspace = true
near-account-id = { workspace = true, features = ["serde", "schemars"] }
near-gas = { workspace = true, features = ["serde", "schemars"] }
near-sdk = { workspace = true, default-features = false, features = ["non-contract-usage"] }
near-token.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
templar-common = { workspace = true, features = ["abi", "non-contract-usage"] }
templar-universal-account.workspace = true
thiserror.workspace = true
uuid.workspace = true

[features]
# Derive `clap::ValueEnum` on CLI-facing enums (e.g. `ContractKind`) so binaries
# can accept them directly as arguments.
clap = ["dep:clap"]

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
