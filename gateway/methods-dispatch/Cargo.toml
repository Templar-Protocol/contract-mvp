[package]
name = "templar-gateway-methods-dispatch"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NEAR dispatch implementations for Templar gateway method specifications"

[dependencies]
async-trait.workspace = true
jsonschema = { version = "0.51.0", default-features = false }
near-abi = "0.4.4"
sha2.workspace = true
templar-contract-artifacts = { workspace = true, features = ["fetch"] }
wasmparser = { version = "0.244.0", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["rt"] }
zstd = "0.13.3"
borsh.workspace = true
near-account-id = { workspace = true, features = ["serde", "schemars"] }
near-api.workspace = true
near-contract-standards.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
templar-common = { workspace = true, features = ["non-contract-usage"] }
templar-gateway-core.workspace = true
templar-gateway-methods-spec.workspace = true
templar-gateway-types.workspace = true
templar-primitives = { workspace = true, features = ["schemars", "serde"] }
templar-proxy-oracle-kernel = { workspace = true, features = ["serde", "schemars"] }
templar-proxy-oracle-near-common.workspace = true
templar-proxy-oracle-near-governance-common.workspace = true
templar-universal-account.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
rstest.workspace = true

[lints]
workspace = true
