[package]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
name = "templar-common"
repository.workspace = true
version = "2.0.0"
description = "Shared contract types, events, assets, and math for Templar Protocol"

[dependencies]
borsh = { workspace = true, features = ["rc"] }
derive_more.workspace = true
hex-literal.workspace = true
hex.workspace = true
k256.workspace = true
near-contract-standards.workspace = true
near-sdk-contract-tools.workspace = true
near-sdk = { workspace = true, default-features = false }
primitive-types.workspace = true
redstone = { workspace = true, default-features = false, features = [] }
schemars.workspace = true
templar-curator-primitives = { path = "../contract/vault/curator-primitives", version = "1.0.1", features = ["borsh", "serde", "std", "borsh-schema", "schemars"] }
templar-primitives = { workspace = true, features = ["near", "redstone"] }
templar-vault-kernel.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { workspace = true, optional = true }
near-jsonrpc-client = { workspace = true, optional = true }
near-primitives = { workspace = true, optional = true }
sha2.workspace = true
near-sdk = { workspace = true, default-features = false, features = ["abi"] }

[dev-dependencies]
rstest.workspace = true
near-sdk = { workspace = true, features = ["unit-testing"] }
jsonschema = { version = "0.51.0", default-features = false }
rand = "0.8"

[lints]
workspace = true

[features]
default = []
abi = ["near-sdk/abi"]
non-contract-usage = ["near-sdk/non-contract-usage"]
rpc = ["dep:clap", "dep:near-jsonrpc-client", "dep:near-primitives"]
