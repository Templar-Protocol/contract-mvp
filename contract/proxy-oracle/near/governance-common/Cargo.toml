[package]
name = "templar-proxy-oracle-near-governance-common"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
version = "0.2.4"
description = "Shared NEAR-facing types for the Templar proxy oracle governance contract"

[dependencies]
templar-common.workspace = true
templar-proxy-oracle-governance-kernel = { workspace = true, features = ["borsh", "serde", "schemars"] }
templar-proxy-oracle-kernel = { workspace = true, features = ["borsh", "serde", "schemars"] }
templar-proxy-oracle-near-common.workspace = true
thiserror.workspace = true
near-sdk.workspace = true
clap = { workspace = true, optional = true }

[features]
# Derive `clap::ValueEnum` on CLI-facing enums (`Role`, `OperationKind`) so host
# binaries (e.g. `tmplrmgr`) can parse them without re-declaring a local mirror.
clap = ["dep:clap"]

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
rstest.workspace = true

[lints]
workspace = true
